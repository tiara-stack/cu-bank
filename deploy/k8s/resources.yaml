apiVersion: apps/v1
kind: Deployment
metadata:
  name: cu-bank-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cu-bank-backend
  template:
    metadata:
      labels:
        app: cu-bank-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: pool-theerapakg-1-3jmgtk
      imagePullSecrets:
        - name: theerapakg-registry
      containers:
        - name: backend
          image: cu-bank-backend:local
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: cu-bank-env
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: FRONTEND_ORIGIN
              value: https://cu-bank.taile52624.ts.net
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cu-bank-backend
spec:
  selector:
    app: cu-bank-backend
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cu-bank-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cu-bank-frontend
  template:
    metadata:
      labels:
        app: cu-bank-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: pool-theerapakg-1-3jmgtk
      imagePullSecrets:
        - name: theerapakg-registry
      containers:
        - name: frontend
          image: cu-bank-frontend:local
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cu-bank-frontend
spec:
  selector:
    app: cu-bank-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cu-bank
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: cu-bank-frontend
      port:
        number: 80
  tls:
    - hosts:
        - cu-bank
